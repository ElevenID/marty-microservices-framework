name: Release Rust platform

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  MMF_PUBLICATION_LAYERS: >-
    mmf-core mmf-testkit mmf-ml mmf-workflow;
    mmf-config mmf-data mmf-observability mmf-resilience mmf-runtime;
    mmf-security mmf-messaging mmf-push;
    mmf-platform mmf-plugins mmf-patterns;
    mmf-services;
    mmf-cli;
    mmf

jobs:
  verify:
    name: Verify immutable Rust release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - name: Bind tag, workflow, main ancestry, and workspace version
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$tag"
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          git fetch --no-tags origin main
          git merge-base --is-ancestor "refs/tags/$tag^{commit}" origin/main
          version="${tag#v}"
          workspace_version="$(sed -n '/^\[workspace.package\]/{:a;n;/^version = /{s/version = "\([^"]*\)"/\1/p;q};ba}' Cargo.toml)"
          test "$version" = "$workspace_version"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace and behavior contracts
        run: cargo test --locked --workspace

  build:
    name: Build source release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.0
      - name: Validate every crate package and archive workspace source
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REQUESTED_TAG#v}"
          mkdir -p release
          for crate in $(printf '%s' "$MMF_PUBLICATION_LAYERS" | tr ';' ' '); do
            cargo package --locked --list -p "$crate" \
              > "release/${crate}.txt"
          done
          git archive --format=tar.gz \
            --prefix="marty-microservices-framework-${version}/" \
            --output="release/marty-microservices-framework-${version}.tar.gz" \
            HEAD
          cargo metadata --locked --format-version 1 > release/cargo-metadata.json
      - name: Generate source SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: release/marty-microservices-framework.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-release-assets
          path: release
          retention-days: 7
          if-no-files-found: error

  publish-crates:
    name: Publish crates.io packages
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.0
      - name: Publish in dependency order and support safe retries
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${REQUESTED_TAG#v}"

          wait_for_index() {
            local crate="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error \
                "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
                return 0
              fi
              echo "Waiting for ${crate}@${version} (${attempt}/30)"
              sleep 10
            done
            return 1
          }

          publish() {
            local crate="$1"
            if curl --fail --silent \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate}@${version} is already published"
            else
              cargo publish --locked -p "$crate"
            fi
            wait_for_index "$crate"
          }

          while IFS= read -r layer; do
            for crate in $layer; do
              publish "$crate"
            done
          done < <(printf '%s' "$MMF_PUBLICATION_LAYERS" | tr ';' '\n')

  release:
    name: Publish signed GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rust-release-assets
          path: release-assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign and checksum assets
        shell: bash
        run: |
          set -euo pipefail
          if find release-assets -mindepth 2 -type f -print -quit | grep -q .; then
            echo "Release assets must be flat because GitHub publishes each asset by basename" >&2
            exit 1
          fi
          find release-assets -type f ! -name '*.sigstore.json' -print0 |
            while IFS= read -r -d '' file; do
              cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            done
          (cd release-assets && find . -type f ! -name SHA256SUMS -print0 |
            sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/**
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/**
