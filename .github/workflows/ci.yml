name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Prevent duplicate cryptographic dependency generations
        shell: bash
        run: |
          duplicates="$(cargo tree --locked --workspace -d -e normal --depth 0)"
          if grep -E '^(p256|p384|p521|sha2|hmac|rand) v' <<< "$duplicates"; then
            echo "Duplicate cryptographic dependency generations entered the workspace graph" >&2
            exit 1
          fi
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check security without optional implementations
        run: cargo check --locked -p mmf-security --no-default-features
      - name: Keep optional security dependencies out of the lean graph
        shell: bash
        run: |
          graph="$(cargo tree --locked -p mmf-security --no-default-features --target all -e normal,build --prefix none)"
          if grep -E '^(cedar-policy|redis|hkdf|p256|p384|p521) v' <<< "$graph"; then
            echo "Optional security implementations leaked into the lean dependency graph" >&2
            exit 1
          fi
      - name: Keep session ECDH curves free of signing defaults
        shell: bash
        run: |
          cargo check --locked -p mmf-security --no-default-features --features session-ecdh
          features="$(cargo tree --locked -p mmf-security --no-default-features --features session-ecdh --target all -e features --prefix none)"
          if grep -E '^p(256|384|521) feature "(default|ecdsa|precomputed-tables)"$' <<< "$features"; then
            echo "Unused signing or precomputed-table features leaked into session ECDH" >&2
            exit 1
          fi
      - name: Check platform without Redis
        run: cargo check --locked -p mmf-platform --no-default-features
      - name: Keep Redis out of the lean platform graph
        shell: bash
        run: |
          graph="$(cargo tree --locked -p mmf-platform --no-default-features --target all -e normal,build --prefix none)"
          if grep -E '^(redis|mmf-security) v' <<< "$graph"; then
            echo "Redis or full security implementation leaked into the lean platform dependency graph" >&2
            exit 1
          fi
      - name: Keep CLI lean and facade complete
        shell: bash
        run: |
          cargo check --locked -p mmf-cli
          cli_graph="$(cargo tree --locked -p mmf-cli --target all -e normal,build --prefix none)"
          facade_graph="$(cargo tree --locked -p mmf --target all -e normal,build --prefix none)"
          if grep -E '^(redis|mmf-security) v' <<< "$cli_graph"; then
            echo "Full security implementation or Redis leaked into the CLI dependency graph" >&2
            exit 1
          fi
          if ! grep -E '^redis v' <<< "$facade_graph"; then
            echo "Facade lost its default Redis implementation" >&2
            exit 1
          fi
      - name: Test workspace and retirement guards
        run: cargo test --locked --workspace
