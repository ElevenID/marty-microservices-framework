name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Check security without optional implementations
        run: cargo check --locked -p mmf-security --no-default-features
      - name: Keep optional security dependencies out of the lean graph
        shell: bash
        run: |
          graph="$(cargo tree --locked -p mmf-security --no-default-features --target all -e normal,build --prefix none)"
          if grep -E '^(cedar-policy|redis|hkdf|p256|p384|p521) v' <<< "$graph"; then
            echo "Optional security implementations leaked into the lean dependency graph" >&2
            exit 1
          fi
      - name: Check platform without Redis
        run: cargo check --locked -p mmf-platform --no-default-features
      - name: Keep Redis out of the lean platform graph
        shell: bash
        run: |
          graph="$(cargo tree --locked -p mmf-platform --no-default-features --target all -e normal,build --prefix none)"
          if grep -E '^redis v' <<< "$graph"; then
            echo "Redis leaked into the lean platform dependency graph" >&2
            exit 1
          fi
      - name: Test workspace and retirement guards
        run: cargo test --locked --workspace
