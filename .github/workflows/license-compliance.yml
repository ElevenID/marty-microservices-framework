# SPDX-License-Identifier: AGPL-3.0-only
name: License Compliance

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-license-metadata:
    name: Rust license metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.93.0
      - name: Require canonical workspace license
        shell: bash
        run: |
          set -euo pipefail
          test "$(cargo metadata --locked --format-version 1 --no-deps |
            jq -r '[.packages[].license] | unique | join(",")')" = "AGPL-3.0-only"
          test -s LICENSE
          test -s NOTICE
      - name: Publish locked dependency inventory
        run: cargo metadata --locked --format-version 1 > dependency-inventory.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-dependency-inventory
          path: dependency-inventory.json
          if-no-files-found: error
          retention-days: 30
