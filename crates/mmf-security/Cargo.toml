[package]
name = "mmf-security"
description = "Canonical identity, policy, session, rate-limit, audit, and security provider contracts for MMF"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
cedar-policy = { workspace = true, optional = true }
chrono.workspace = true
hmac.workspace = true
hkdf = { workspace = true, optional = true }
mmf-core.workspace = true
mmf-observability.workspace = true
rand.workspace = true
redis.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
p521 = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
# Preserve the published API for existing consumers while allowing lightweight
# security contracts to omit Cedar and its policy compiler.
default = ["cedar", "session-ecdh"]
cedar = ["dep:cedar-policy"]
session-ecdh = ["dep:hkdf", "dep:p256", "dep:p384", "dep:p521"]

[lints]
workspace = true
